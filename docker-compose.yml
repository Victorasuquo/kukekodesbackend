name: kukekodes

x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  PORT: "8000"
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: kukekodes-api:${IMAGE_TAG:-local}
  env_file:
    - path: ${APP_ENV_FILE:-.env}
      required: true
  environment: *app-environment
  restart: unless-stopped
  init: true
  networks:
    - private
  depends_on:
    redis:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  api:
    <<: *app-service
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-*}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s

  worker:
    <<: *app-service
    command:
      - celery
      - --app=app.task_queue:celery_app
      - worker
      - --loglevel=${LOG_LEVEL:-INFO}
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-200}
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app=app.task_queue:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s

  scheduler:
    <<: *app-service
    command:
      - celery
      - --app=app.task_queue:celery_app
      - beat
      - --loglevel=${LOG_LEVEL:-INFO}
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
  private:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  redis_data:
