name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/kukekodes
      MONGODB_URI: mongodb://127.0.0.1:27017
      JWT_SECRET: ci-only-secret-not-valid-for-production-123456789
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile backend
        run: python -m compileall -q app scripts

      - name: Validate OpenAPI contract
        run: python -m scripts.check_openapi

      - name: Run backend tests
        run: python -m pytest -q --disable-warnings --maxfail=1

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build production image
        run: docker build --tag kukekodes-api:ci .
